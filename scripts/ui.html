<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khmer TTS</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#667085;--line:#e1e4ea;--accent:#2563eb;--accent-ink:#fff;--ok:#16a34a;--err:#dc2626;--hl:#dbeafe}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mute:#98a2b3;--line:#2a2f3a;--accent:#60a5fa;--accent-ink:#0b1220;--hl:#1e3a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Noto Sans Khmer","Khmer OS",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
textarea{width:100%;min-height:200px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem;line-height:1.8}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button,.btn{font:inherit;font-size:.95rem;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.grow{flex:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin-top:12px}
.opts label{display:block;font-size:.85rem;color:var(--mute)}
.opts input{width:100%}
.opts b{color:var(--ink);font-weight:600}
#status{font-size:.9rem;color:var(--mute);min-height:1.4em}
#status.err{color:var(--err)}
#bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:1rem;line-height:1.7}
li:hover{background:var(--bg)}
li.playing{background:var(--hl)}
li .n{color:var(--mute);min-width:2.2em;font-variant-numeric:tabular-nums}
li .s{margin-left:auto;font-size:.8rem;color:var(--mute);white-space:nowrap}
li.ready .s{color:var(--ok)}
audio{width:100%;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Khmer Text-to-Speech</h1>
  <p class="sub">facebook/mms-tts-khm · running locally · long text is split automatically and starts playing as soon as the first part is ready.</p>

  <div class="card">
    <textarea id="text" placeholder="បញ្ចូលអត្ថបទខ្មែរនៅទីនេះ… (paste any length of Khmer text)"></textarea>
    <div class="row">
      <button class="primary" id="speak">▶ Speak</button>
      <button id="stop" disabled>■ Stop</button>
      <button id="dl" disabled>⬇ Download WAV</button>
      <label class="btn">📄 Open .txt<input type="file" id="file" accept=".txt,text/plain" hidden></label>
      <span class="grow"></span>
      <span id="count" class="sub" style="margin:0"></span>
    </div>
    <div class="opts">
      <label>Voice<select id="voice" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit"><option value="km-KH-SreymomNeural">Sreymom · female (online, natural)</option><option value="km-KH-PisethNeural">Piseth · male (online, natural)</option><option value="mms">MMS-TTS (offline, basic)</option></select></label>
      <label>Speed <b id="vSpeed">1.0</b>×<input type="range" id="speed" min="0.6" max="1.4" step="0.05" value="1"></label>
      <label>Pause between sentences <b id="vPause">0.2</b>s<input type="range" id="pause" min="0" max="1.5" step="0.05" value="0.2"></label>
      <label>Pause between paragraphs <b id="vPara">0.6</b>s<input type="range" id="para" min="0" max="2.5" step="0.1" value="0.6"></label>
      <label>Max chunk length <b id="vMax">250</b> chars<input type="range" id="max" min="40" max="400" step="10" value="250"></label>
    </div>
    <div id="bar"><i></i></div>
    <div id="status"></div>
    <audio id="player" controls hidden></audio>
  </div>

  <div class="card" id="listCard" hidden>
    <ol id="list"></ol>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const els = {text:$('text'), speak:$('speak'), stop:$('stop'), dl:$('dl'), file:$('file'), status:$('status'),
  bar:$('bar').firstElementChild, list:$('list'), listCard:$('listCard'), player:$('player'), count:$('count')};
const sliders = {speed:'vSpeed', pause:'vPause', para:'vPara', max:'vMax'};
for (const k of ['speed','pause','para','max']) { try{ if (localStorage.getItem('ktts_v2') !== '1') localStorage.removeItem('ktts_'+k) }catch(e){} }
try{ localStorage.setItem('ktts_v2','1') }catch(e){}
for (const [id, out] of Object.entries(sliders)) {
  const el = $(id), upd = () => { $(out).textContent = String(+el.value); try{localStorage.setItem('ktts_'+id, el.value)}catch(e){} };
  try { const v = localStorage.getItem('ktts_'+id); if (v) el.value = v; } catch(e){}
  el.addEventListener('input', upd); upd();
}
try { els.text.value = localStorage.getItem('ktts_text') || ''; const v = localStorage.getItem('ktts_voice'); if (v) $('voice').value = v; } catch(e){}
$('voice').addEventListener('change', e => { try{localStorage.setItem('ktts_voice', e.target.value)}catch(_){}
  const m = $('max'); m.value = e.target.value === 'mms' ? 110 : 250; m.dispatchEvent(new Event('input')); });
els.text.addEventListener('input', () => { els.count.textContent = els.text.value.length + ' chars'; try{localStorage.setItem('ktts_text', els.text.value)}catch(e){} });
els.count.textContent = els.text.value.length + ' chars';

const opts = () => ({voice:$('voice').value, text:els.text.value, speed:+$('speed').value, pause:+$('pause').value, para_pause:+$('para').value, max_chars:+$('max').value});
const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
const setStatus = (t, err) => { els.status.textContent = t; els.status.className = err ? 'err' : ''; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

els.file.addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  els.text.value = await f.text(); els.text.dispatchEvent(new Event('input')); e.target.value = '';
});

let run = 0, chunks = [], blobs = [], rows = [], waiters = [];

function markPlaying(i) { rows.forEach((r, k) => r.classList.toggle('playing', k === i)); if (rows[i]) rows[i].scrollIntoView({block:'nearest'}); }

function playBlob(i) {
  return new Promise(res => {
    els.player.src = URL.createObjectURL(blobs[i]); els.player.hidden = false;
    markPlaying(i);
    els.player.onended = els.player.onerror = () => res();
    els.player.play().catch(() => res());
  });
}

async function nextBlob(i, token) {           // wait until chunk i has been synthesized
  while (!blobs[i]) { if (token !== run) return null; await sleep(80); }
  return blobs[i];
}

async function speak(from = 0) {
  const token = ++run;
  els.player.pause(); blobs = []; els.dl.disabled = true;
  const o = opts();
  if (!o.text.trim()) { setStatus('Enter some text first.', true); return; }
  els.speak.disabled = true; els.stop.disabled = false; setStatus('Splitting text…'); els.bar.style.width = '0';
  try {
    const r = await post('/api/split', o); chunks = await r.json();
    if (!chunks.length) throw new Error('No readable text.');
    els.list.innerHTML = ''; rows = chunks.map((c, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="n"></span><span class="t"></span><span class="s">waiting</span>';
      li.children[0].textContent = i + 1; li.children[1].textContent = c.text;
      li.onclick = () => speak(i); els.list.appendChild(li); return li;
    });
    els.listCard.hidden = false;

    // producer: synthesize chunks in order (server caches, so re-plays are instant)
    const producer = (async () => {
      for (let i = from; i < chunks.length; i++) {
        if (token !== run) return;
        rows[i].children[2].textContent = 'generating…';
        const res = await post('/api/synth', {voice:o.voice, text:chunks[i].text, speed:o.speed});
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        blobs[i] = await res.blob();
        rows[i].classList.add('ready'); rows[i].children[2].textContent = 'ready';
        els.bar.style.width = ((i - from + 1) / (chunks.length - from) * 100) + '%';
        setStatus(`Generated ${i - from + 1}/${chunks.length - from}` + (i === from ? ' — playing…' : ''));
      }
    })();
    producer.catch(e => { if (token === run) { setStatus('Error: ' + e.message, true); run++; } });

    // consumer: play chunks as they become ready
    for (let i = from; i < chunks.length; i++) {
      const b = await nextBlob(i, token); if (token !== run || !b) return;
      await playBlob(i); if (token !== run) return;
      if (i < chunks.length - 1) await sleep(1000 * (chunks[i].pause === 'paragraph' ? o.para_pause : o.pause));
    }
    markPlaying(-1); setStatus('Finished.'); els.dl.disabled = false;
  } catch (e) {
    setStatus('Error: ' + e.message + ' — is the server still running?', true);
  } finally {
    if (token === run || true) { els.speak.disabled = false; els.stop.disabled = true; }
  }
}

els.speak.onclick = () => speak(0);
els.stop.onclick = () => { run++; els.player.pause(); markPlaying(-1); els.speak.disabled = false; els.stop.disabled = true; setStatus('Stopped.'); };
els.dl.onclick = async () => {
  setStatus('Building full WAV…'); els.dl.disabled = true;
  try {
    const res = await post('/api/full', opts()); if (!res.ok) throw new Error((await res.json()).error);
    const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = 'khmer-tts.wav'; a.click();
    setStatus('Saved khmer-tts.wav');
  } catch (e) { setStatus('Error: ' + e.message, true); }
  els.dl.disabled = false;
};
</script>
</body>
</html>
