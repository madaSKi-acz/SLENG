# Purpose: Run every hard rule from CODING_STANDARDS.md before a commit lands.
# Layer:   repo tooling. Install once: `pre-commit install`; run all: `pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: sleng-limits
        name: size limits + file headers
        entry: python tools/check_limits.py
        language: system
        files: \.(py|ts|vue|css|js)$
        exclude: (^|/)(node_modules|dist)/|\.d\.ts$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (engine)
        entry: mypy --config-file engine/pyproject.toml engine/src
        language: system
        pass_filenames: false
        files: ^engine/
      - id: import-layers
        name: engine import layers
        entry: lint-imports --config engine/pyproject.toml
        language: system
        pass_filenames: false
        files: ^engine/src/
      - id: web-lint
        name: eslint + vue-tsc (web)
        entry: npm --prefix web run lint
        language: system
        pass_filenames: false
        files: ^web/
