# Purpose: Package definition of the SLENG engine, its optional extras, and its type/import rules.
# Layer:   engine packaging. Install for development: pip install -e "engine[all,dev]"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sleng"
version = "0.2.0"
description = "Khmer text-to-speech engine: voices, voice cloning, audio and video export."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Offline voice: facebook/mms-tts-khm (CC-BY-NC 4.0).
mms = ["torch>=2.1", "transformers>=4.40", "uroman>=1.3"]
# Microsoft neural Khmer voices through edge-tts (needs internet).
online = ["edge-tts>=7.0"]
# Voice cloning. OpenVoice itself is installed separately, without its pins:
#   pip install --no-deps https://github.com/myshell-ai/OpenVoice/archive/refs/heads/main.zip
clone = ["torch>=2.1", "librosa>=0.10", "huggingface-hub>=0.20"]
# HTTP adapter.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
all = ["sleng[mms,online,clone,api]"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "import-linter>=2.0",
       "pre-commit>=3.7"]

[project.scripts]
sleng = "sleng.adapters.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sleng"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "torch.*", "transformers.*", "edge_tts.*", "soundfile.*", "librosa.*", "openvoice.*",
  "imageio_ffmpeg.*", "scipy.*", "huggingface_hub.*", "uvicorn.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "sleng"

[[tool.importlinter.contracts]]
name = "Engine layers point one way (top may import bottom, never the reverse)"
type = "layers"
layers = [
  "sleng.adapters",
  "sleng.container",
  "sleng.config",
  "sleng.services",
  "sleng.voices",
  "sleng.cloning | sleng.media",
  "sleng.audio | sleng.text",
  "sleng.infra",
  "sleng.domain",
]
