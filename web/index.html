<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khmer Text to Speech</title>
    <script>
      /* Apply the saved theme before first paint (no flash). Keys: see src/stores/appearance.ts */
      try {
        var mode = localStorage.getItem('sleng.mode') || 'system';
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        root.dataset.mode = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
        root.dataset.palette = localStorage.getItem('sleng.palette') || 'indigo';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
